name: audit-fast

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: Etc/UTC

jobs:
  audit-fast:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact Python dependencies
        run: python3 -u -m pip install --require-hashes -r requirements.txt
      - name: Run the fast artifact audit
        run: make audit-fast

  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ELAN_VERSION: v4.2.4
      ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
    steps:
      - name: Check out the artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install elan (pinned release, checksum-verified)
        working-directory: ${{ runner.temp }}
        run: |
          curl -sSfL -o elan.tar.gz \
            "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
          echo "$ELAN_SHA256  elan.tar.gz" | sha256sum -c -
          tar -xzf elan.tar.gz
          ./elan-init -y --no-modify-path --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch the Mathlib build cache
        run: cd lean && lake exe cache get
      - name: Build the formalization and check its axioms
        run: make lean
      - name: Summarize the axiom check
        run: |
          {
            echo "### Lean axiom check"
            echo
            echo "$(wc -l < lean/.lake/axioms-flat.txt) indexed declarations; axioms used:"
            echo
            sed -e 's/^depends on axioms: //' -e 's/^does not depend on any axioms$/(none)/' \
              lean/.lake/axioms-flat.txt | sort | uniq -c | sed 's/^ */- /'
          } >> "$GITHUB_STEP_SUMMARY"
