name: audit-fast

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  TZ: Etc/UTC

jobs:
  audit-fast:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the artifact
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact Python dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Install GMP development files
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgmp-dev
      - name: Run the fast artifact audit
        run: make audit-fast
